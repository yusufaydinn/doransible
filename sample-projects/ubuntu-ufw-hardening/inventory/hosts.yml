---
# inventory/hosts.yml
#
# Secretsiz örnek inventory. "ufw-hardening-target.example", RFC 2606'da
# belgeleme için ayrılmış, hiçbir zaman çözümlenmeyecek bir alan adıdır.
# Bugün UI'da yönlendirmeli bir onboarding/public-key kurulum sihirbazı ve
# şifreli, uygulama-yönetimli bir credential deposu yoktur (bkz.
# ../ubuntu-ssh-audit/README.md → "Mevcut ürün gerçeği" -- bu proje de
# aynı sınırlara tabidir); gerçek host, SSH kullanıcı adı ve private key
# yolunu bu dosyada kendiniz tanımlarsınız.
#
# Private key'in kendi içeriği bu dosyaya yazılmaz: yalnızca controller
# üzerinde ANSIBLEOPS_SSH_KEY_ROOT_ALLOWLIST ile izin verilen bir kök
# altında duran dosyanın mutlak yolu `ansible_ssh_private_key_file` ile
# referans verilir. Parola ve become-parolası desteklenmez; hedef
# kullanıcının parolasız (NOPASSWD) sudo çalıştırabilmesi gerekir.
#
# ansible_port: hedefte sshd standart olmayan bir portta dinliyorsa burada
# tanımlayın -- role, SSH allow kuralını TAM OLARAK bu port için, UFW
# enable edilmeden ÖNCE ekler. Tanımlanmazsa 22 varsayılır (bkz.
# roles/ufw_hardening/tasks/system_checks.yml).
#
# ÖNEMLİ -- lockout riski: bu playbook UFW'yi etkinleştirir (default
# incoming: deny). SSH allow kuralı her zaman enable'dan ÖNCE uygulanır ve
# reset_connection + wait_for_connection ile YENİ bir bağlantının
# kurulabildiği kanıtlanır -- ama bağlantı TAMAMEN kesilirse (ör. host
# ağ/routing sorunu, beklenmeyen bir nedenle erişilemez hale gelmesi)
# uzaktan otomatik rollback GARANTİ EDİLEMEZ (bkz. README.md "Lockout ve
# rollback sınırı"). Önce Check mode ile önizleyin.

all:
  children:
    ufw_hardening_targets:
      hosts:
        ubuntu-ufw-hardening-demo:
          ansible_host: ufw-hardening-target.example
          ansible_user: changeme
          # ansible_port: 2222
