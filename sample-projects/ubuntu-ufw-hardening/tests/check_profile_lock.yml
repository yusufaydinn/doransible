---
# tests/check_profile_lock.yml
#
# Offline: roles/ufw_hardening/tasks/profile_lock_check.yml SAF mantığını,
# gerekirse override edilmiş (bozulmuş) ufw_hardening_* değişkenleriyle
# çalıştırır. Gerçek host gerekmez.

- name: UFW Hardening offline profile-lock harness
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/ufw_hardening/defaults/main.yml
  tasks:
    - name: Profil kilidi kontrolünü çalıştır
      ansible.builtin.import_tasks: ../roles/ufw_hardening/tasks/profile_lock_check.yml
