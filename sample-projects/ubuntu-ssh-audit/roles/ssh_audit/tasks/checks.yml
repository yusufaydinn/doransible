---
# roles/ssh_audit/tasks/checks.yml
#
# ssh_audit_sshd_t.stdout / .stdout_lines içindeki GLOBAL/DEFAULT sshd
# yapılandırmasını değerlendiren, host'a bağlı olmayan saf mantık. main.yml
# bunu gerçek bir `sshd -T` (bağlantı bağlamı olmadan, `-C` verilmeden)
# sonrasında çağırır; offline regresyon testleri (../../../tests) aynı
# sonucu sahte (fixture) sshd -T çıktısıyla, gerçek host veya sudo
# gerektirmeden üretmek için bu dosyayı doğrudan import eder.
#
# Kapsam sınırı: `-C` olmadan `sshd -T` yalnız global/default baseline'ı
# döndürür; `Match User`/`Match Group`/`Match Address`/`Match LocalAddress`
# gibi koşullu blokların olası geçersiz kılmaları bu değerlendirmeye hiç
# YANSIMAZ. Bu dosyadaki COMPLIANT sonucu yalnız o baseline içindir (bkz.
# README.md "Sınırlar"); bu dilimde context sistemi veya sshd_config
# taraması yoktur.
#
# Fail-closed sözleşmesi iki farklı alan türü için ayrıdır:
#   - Scalar alanlar (PermitRootLogin, PasswordAuthentication, ...,
#     MaxAuthTries, LoginGraceTime): sshd -T'de her zaman **tam olarak bir
#     satır** üretirler. Alan eksikse, birden fazla kez görülmüşse
#     (duplicate) veya beklenmeyen/boş bir değer taşıyorsa kontrol
#     NON-COMPLIANT sayılır.
#   - Liste alanları (AllowUsers/AllowGroups/DenyUsers/DenyGroups): 0..N
#     satır üretebilirler (her eleman kendi satırında). 0 satır geçerli
#     "liste boş" durumudur; N>1 satır duplicate değildir, toplanır.
#     Yalnız keyword'ü olup değeri olmayan bozuk bir satır fail-closed'dır.
# Hiçbir durumda boş/ayrıştırılamayan bir değer sessizce compliant kabul
# edilmez.

- name: "SSH Audit | Root SSH girişi kapalı mı"
  vars:
    ssh_audit_field_lines: "{{ ssh_audit_sshd_t.stdout_lines | select('match', '^permitrootlogin(\\s|$)') | list }}"
    ssh_audit_field_line: "{{ (ssh_audit_field_lines + ['permitrootlogin unset'])[0] }}"
    ssh_audit_field_value: "{{ (ssh_audit_field_line.split(None, 1) + [''])[1] }}"
  ansible.builtin.assert:
    that:
      - ssh_audit_field_lines | length == 1
      - ssh_audit_field_value in ssh_audit_permit_root_login_allowed
    fail_msg: >-
      NON-COMPLIANT/FAIL-CLOSED: permitrootlogin sshd -T çıktısında
      {{ ssh_audit_field_lines | length }} kez görüldü (1 bekleniyor), değer='{{ ssh_audit_field_value }}',
      izin verilen değerler: {{ ssh_audit_permit_root_login_allowed }}.
    success_msg: "COMPLIANT: PermitRootLogin={{ ssh_audit_field_value }}."
  ignore_errors: true
  register: ssh_audit_check_root_login

- name: "SSH Audit | Parola ile kimlik doğrulama beklenen profile uygun mu"
  vars:
    ssh_audit_field_lines: "{{ ssh_audit_sshd_t.stdout_lines | select('match', '^passwordauthentication(\\s|$)') | list }}"
    ssh_audit_field_line: "{{ (ssh_audit_field_lines + ['passwordauthentication unset'])[0] }}"
    ssh_audit_field_value: "{{ (ssh_audit_field_line.split(None, 1) + [''])[1] }}"
  ansible.builtin.assert:
    that:
      - ssh_audit_field_lines | length == 1
      - ssh_audit_field_value in ["yes", "no"]
      - (ssh_audit_field_value == "yes") == ssh_audit_password_authentication_allowed
    fail_msg: >-
      NON-COMPLIANT/FAIL-CLOSED: passwordauthentication sshd -T çıktısında
      {{ ssh_audit_field_lines | length }} kez görüldü (1 bekleniyor), değer='{{ ssh_audit_field_value }}'
      (yes/no bekleniyor), beklenen izin: {{ ssh_audit_password_authentication_allowed }}.
    success_msg: "COMPLIANT: PasswordAuthentication={{ ssh_audit_field_value }}."
  ignore_errors: true
  register: ssh_audit_check_password_auth

- name: "SSH Audit | Public-key kimlik doğrulama açık mı"
