      {{ ssh_audit_field_lines | length }} kez görüldü (1 bekleniyor), değer='{{ ssh_audit_field_value }}'
      (yes/no bekleniyor), beklenen: {{ ssh_audit_pubkey_authentication_required }}.
    success_msg: "COMPLIANT: PubkeyAuthentication={{ ssh_audit_field_value }}."
