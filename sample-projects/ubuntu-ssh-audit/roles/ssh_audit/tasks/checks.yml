      (yes/no bekleniyor), beklenen: {{ ssh_audit_kbd_interactive_authentication_allowed }}
      (MFA/PAM kullanan profiller ssh_audit_kbd_interactive_authentication_allowed=true ayarlamalı).
    success_msg: "COMPLIANT: KbdInteractiveAuthentication={{ ssh_audit_field_value }}."
