---
# inventory/hosts.yml
#
# Secretsiz örnek inventory. Gerçek bir host yoktur: "ssh-audit-target.example"
# değeri RFC 2606'da belgeleme için ayrılmış, hiçbir zaman çözümlenmeyecek bir
# alan adıdır. Bugün UI'da yönlendirmeli bir onboarding/public-key kurulum
# sihirbazı ve şifreli, uygulama-yönetimli bir credential deposu yoktur (bkz.
# README.md → "Mevcut ürün gerçeği"); gerçek host, SSH kullanıcı adı ve
# private key yolunu bu dosyada kendiniz tanımlarsınız.
#
# Private key'in kendi içeriği bu dosyaya yazılmaz: yalnızca controller
# üzerinde ANSIBLEOPS_SSH_KEY_ROOT_ALLOWLIST ile izin verilen bir kök altında
# duran dosyanın mutlak yolu `ansible_ssh_private_key_file` ile referans
# verilir. Parola ve become-parolası desteklenmez; audit için hedef
# kullanıcının parolasız (NOPASSWD) sudo çalıştırabilmesi gerekir.

# Profile özel beklentileri grup değişkeni olarak override edebilirsiniz,
# örn. ssh_audit_targets.vars altına:
#   ssh_audit_tcp_forwarding_allowed: true               # bastion/jump-host
#   ssh_audit_kbd_interactive_authentication_allowed: true  # PAM/MFA

all:
  children:
    ssh_audit_targets:
      hosts:
        ubuntu-ssh-audit-demo:
          ansible_host: ssh-audit-target.example
          ansible_user: changeme
