---
# inventory/hosts.yml
#
# Secretsiz örnek inventory. "ssh-hardening-target.example", RFC 2606'da
# belgeleme için ayrılmış, hiçbir zaman çözümlenmeyecek bir alan adıdır.
# Bugün UI'da yönlendirmeli bir onboarding/public-key kurulum sihirbazı ve
# şifreli, uygulama-yönetimli bir credential deposu yoktur (bkz.
# ../../ubuntu-ssh-audit/README.md → "Mevcut ürün gerçeği" -- bu proje de
# aynı sınırlara tabidir); gerçek host, SSH kullanıcı adı ve private key
# yolunu bu dosyada kendiniz tanımlarsınız.
#
# Private key'in kendi içeriği bu dosyaya yazılmaz: yalnızca controller
# üzerinde ANSIBLEOPS_SSH_KEY_ROOT_ALLOWLIST ile izin verilen bir kök
# altında duran dosyanın mutlak yolu `ansible_ssh_private_key_file` ile
# referans verilir. Parola ve become-parolası desteklenmez; hedef
# kullanıcının parolasız (NOPASSWD) sudo çalıştırabilmesi gerekir.
#
# ÖNEMLİ -- lockout riski: bu playbook PasswordAuthentication'ı kapatır.
# R1-V3H4-SIMPLIFY: manuel bir onay adımına gerek YOKTUR -- role,
# normal mode'da apply.yml'e ulaşmadan ÖNCE hedefe key-based erişimi VE
# passwordless (NOPASSWD) sudo'yu OTOMATİK olarak, gerçek bir bağlantı+
# yetki denemesiyle doğrular (bkz. roles/ssh_hardening/tasks/
# system_checks.yml ve README.md "Otomatik SSH/sudo önkoşulu"). Bu
# doğrulama başarısızsa hiçbir dosya yazılmaz, hiçbir servis reload
# edilmez. Operatörün yapması gereken TEK şey, aşağıdaki
# `ansible_ssh_private_key_file` ile referans verilen private key'in
# hedefte GERÇEKTEN parolasız erişim sağladığından ve hedef kullanıcının
# NOPASSWD sudo'ya sahip olduğundan emin olmaktır -- DORAnsible bu
# yetkiyi VERMEZ, yalnız çalıştırmadan önce var olup olmadığını doğrular.

all:
  children:
    ssh_hardening_targets:
      hosts:
        ubuntu-ssh-hardening-demo:
          ansible_host: ssh-hardening-target.example
          ansible_user: changeme
