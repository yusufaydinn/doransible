      - ufw_audit_field_value == ufw_audit_expected_default_forward_policy
    fail_msg: >-
      NON-COMPLIANT/FAIL-CLOSED: DEFAULT_FORWARD_POLICY /etc/default/ufw içinde
      {{ ufw_audit_field_lines | length }} kez görüldü (1 bekleniyor),
      değer='{{ ufw_audit_field_value }}',
      beklenen='{{ ufw_audit_expected_default_forward_policy }}'.
    success_msg: "COMPLIANT: DEFAULT_FORWARD_POLICY={{ ufw_audit_field_value }}."
  ignore_errors: true
  register: ufw_audit_check_forward_policy

- name: "UFW Audit | Logging açık ve güvenli düzeyde mi (ufw status verbose)"
  # "Logging: on (<level>)" biçimini regex grup indeksleme (regex_search
  # match[1]) yerine, izin verilen her seviye için tam beklenen satırı
  # üretip üyelik testiyle (`in`) karşılaştırarak doğrular -- bu, eşleşme
  # bulunamadığında ASLA istisna atmaz (ssh_audit/checks.yml'deki aynı
  # güvenli-indeksleme prensibi, bkz. o dosyadaki LoginGraceTime notu).
  vars:
    ufw_audit_status_lines: "{{ ufw_audit_status_verbose.stdout_lines | default([]) }}"
    ufw_audit_logging_field_lines: "{{ ufw_audit_status_lines | select('match', '^Logging:\\s') | list }}"
    ufw_audit_logging_line: "{{ (ufw_audit_logging_field_lines + ['Logging: unset'])[0] }}"
    ufw_audit_logging_compliant_lines: "{{ ufw_audit_logging_allowed_levels | map('regex_replace', '^(.*)$', 'Logging: on (\\1)') | list }}"
  ansible.builtin.assert:
    that:
      - ufw_audit_logging_field_lines | length == 1
      - ufw_audit_logging_line in ufw_audit_logging_compliant_lines
    fail_msg: >-
      NON-COMPLIANT/FAIL-CLOSED: 'Logging:' satırı
      {{ ufw_audit_logging_field_lines | length }} kez görüldü (1 bekleniyor),
      satır='{{ ufw_audit_logging_line }}', kabul edilen biçimler:
      {{ ufw_audit_logging_compliant_lines }} ('off' veya ayrıştırılamayan bir
      seviye her zaman NON-COMPLIANT'tır).
    success_msg: "COMPLIANT: {{ ufw_audit_logging_line }}."
  ignore_errors: true
  register: ufw_audit_check_logging

- name: "UFW Audit | Inventory SSH portu geçerli mi (1..65535)"
  # ansible_port inventory'de tanımlı değilse Ansible'ın gerçek SSH
  # bağlantısı için varsayılan davranışıyla tutarlı biçimde 22 varsayılır.
  # Sayısal biçim önce `is match` ile doğrulanır (ssh_audit/checks.yml'deki
  # aynı gerekçeyle: `| int` filtresi sayısal olmayan bir string üzerinde
  # şablon istisnası atabilir) -- bu yüzden ayrıştırılamayan bir değer ASLA
  # `| int`'e gönderilmez, doğrudan fail-closed sayılır.
  vars:
    ufw_audit_ssh_port_raw: "{{ ansible_port | default(22) }}"
    ufw_audit_ssh_port_valid_format: "{{ (ufw_audit_ssh_port_raw | string) is match('^[0-9]+$') }}"
    ufw_audit_ssh_port_numeric: "{{ ((ufw_audit_ssh_port_raw | string) | int) if ufw_audit_ssh_port_valid_format else -1 }}"
  ansible.builtin.assert:
    that:
      - ufw_audit_ssh_port_valid_format
      - ufw_audit_ssh_port_numeric | int >= 1
      - ufw_audit_ssh_port_numeric | int <= 65535
    fail_msg: >-
      NON-COMPLIANT/FAIL-CLOSED: ansible_port='{{ ufw_audit_ssh_port_raw }}'
      geçerli bir 1..65535 port numarası değil (sayısal biçim
      {{ 'geçerli' if ufw_audit_ssh_port_valid_format else 'GEÇERSİZ' }}).
    success_msg: "COMPLIANT: SSH portu={{ ufw_audit_ssh_port_numeric }}."
  ignore_errors: true
  register: ufw_audit_check_ssh_port

- name: "UFW Audit | SSH portu için en az bir TCP allow kuralı var mı"
  # Yalnız açıkça desteklenen `ufw status verbose` biçimleri kabul edilir:
  #   "<port>/tcp ALLOW IN <kaynak>", "<port> ALLOW IN <kaynak>" (protokol
  #   verilmemişse hem tcp hem udp'yi kapsar) ve bunların "(v6)" IPv6
  #   varyantları. Uygulama profili tabanlı kurallar ("OpenSSH ALLOW IN
  #   Anywhere" gibi) veya port ARALIĞI kuralları ("6000:6007/tcp ALLOW IN
  #   Anywhere") KASITLI OLARAK eşleşmez -- bunlar bu port için açık ve
  #   tekil bir izin olduğunu KANITLAMAZ (bkz. README.md "Desteklenen ufw
  #   status verbose biçimleri"); belirsiz/tanınmayan çıktı ASLA compliant
  #   sayılmaz. Yalnızca "ALLOW IN" eylemi kabul edilir; "LIMIT IN" (rate
  #   limited) veya "DENY"/"REJECT" bu kontrolü sağlamaz.
  vars:
    ufw_audit_status_lines: "{{ ufw_audit_status_verbose.stdout_lines | default([]) }}"
    ufw_audit_ssh_port_raw: "{{ ansible_port | default(22) }}"
    ufw_audit_ssh_port_valid_format: "{{ (ufw_audit_ssh_port_raw | string) is match('^[0-9]+$') }}"
    ufw_audit_ssh_port_numeric: "{{ ((ufw_audit_ssh_port_raw | string) | int) if ufw_audit_ssh_port_valid_format else -1 }}"
    ufw_audit_ssh_allow_pattern: "^{{ ufw_audit_ssh_port_numeric }}(/tcp)?( \\(v6\\))?\\s+ALLOW\\s+IN\\s+\\S.*$"
    ufw_audit_ssh_allow_lines: "{{ ufw_audit_status_lines | select('match', ufw_audit_ssh_allow_pattern) | list }}"
  ansible.builtin.assert:
    that:
      - ufw_audit_ssh_allow_lines | length >= 1
    fail_msg: >-
      NON-COMPLIANT/FAIL-CLOSED: SSH portu {{ ufw_audit_ssh_port_numeric }}/tcp
      için `ufw status verbose` çıktısında desteklenen biçimde bir "ALLOW IN"
      kuralı bulunamadı (0 satır eşleşti). Uygulama profili tabanlı kurallar
      veya port aralıkları bu kontrolü SAĞLAMAZ.
    success_msg: >-
      COMPLIANT: SSH portu {{ ufw_audit_ssh_port_numeric }}/tcp için
      {{ ufw_audit_ssh_allow_lines | length }} allow kuralı bulundu:
      {{ ufw_audit_ssh_allow_lines }}.
  ignore_errors: true
  register: ufw_audit_check_ssh_allow_rule

- name: "UFW Audit | Sonuç: uyumluluk özeti"
  ansible.builtin.assert:
    that:
      - ufw_audit_check_binary is succeeded
      - ufw_audit_check_active is succeeded
      - ufw_audit_check_firewalld is succeeded
      - ufw_audit_check_ipv6 is succeeded
      - ufw_audit_check_input_policy is succeeded
      - ufw_audit_check_output_policy is succeeded
      - ufw_audit_check_forward_policy is succeeded
      - ufw_audit_check_logging is succeeded
      - ufw_audit_check_ssh_port is succeeded
      - ufw_audit_check_ssh_allow_rule is succeeded
    fail_msg: >-
      NON-COMPLIANT: bir veya daha fazla UFW kontrolü uygunsuz. Ayrıntı için
      yukarıdaki kontrol task'larına bakın.
    success_msg: >-
      COMPLIANT: tüm UFW kontrolleri (binary, active, firewalld çatışması,
      IPV6/DEFAULT_INPUT_POLICY/DEFAULT_OUTPUT_POLICY/DEFAULT_FORWARD_POLICY,
      logging, SSH portu geçerliliği, SSH allow kuralı) beklenen profille
      uyumlu. Bu, tam ağ güvenliği garantisi DEĞİLDİR -- bkz. README.md
      "Sınırlar" (örn. Docker/custom nftables trafiği UFW'yi bypass edebilir).
