---
# inventory/hosts.yml
#
# Secretsiz örnek inventory. Gerçek bir host yoktur: "ufw-audit-target.example"
# değeri RFC 2606'da belgeleme için ayrılmış, hiçbir zaman çözümlenmeyecek bir
# alan adıdır. Bugün UI'da yönlendirmeli bir onboarding sihirbazı ve şifreli,
# uygulama-yönetimli bir credential deposu yoktur (bkz.
# ../ubuntu-ssh-audit/README.md → "Mevcut ürün gerçeği" -- aynı gerçek bu
# project için de geçerlidir); gerçek host, SSH kullanıcı adı ve private key
# yolunu bu dosyada kendiniz tanımlarsınız.
#
# Private key'in kendi içeriği bu dosyaya yazılmaz: yalnızca controller
# üzerinde ANSIBLEOPS_SSH_KEY_ROOT_ALLOWLIST ile izin verilen bir kök altında
# duran dosyanın mutlak yolu `ansible_ssh_private_key_file` ile referans
# verilir. Parola ve become-parolası desteklenmez; audit için hedef
# kullanıcının parolasız (NOPASSWD) sudo çalıştırabilmesi gerekir.
#
# ansible_port: hedefte sshd standart olmayan bir portta dinliyorsa burada
# tanımlayın -- audit, SSH allow kuralını TAM OLARAK bu port için arar.
# Tanımlanmazsa 22 varsayılır (bkz. roles/ufw_audit/tasks/checks.yml).

all:
  children:
    ufw_audit_targets:
      hosts:
        ubuntu-ufw-audit-demo:
          ansible_host: ufw-audit-target.example
          ansible_user: changeme
          # ansible_port: 2222
