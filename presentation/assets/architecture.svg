<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DORAnsible UML bileşen diyagramı</title>
  <desc id="desc">Operatörden React arayüzüne, FastAPI backendine, veritabanına, workera, ansible-runner ve yönetilen hostlara uzanan mevcut akış ile planlanan AI katmanı.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font: 600 24px Inter, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .group { font: 700 22px Inter, Arial, sans-serif; fill: #0f766e; }
      .line { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#f8fafc"/>

  <rect x="35" y="75" width="210" height="170" rx="26" fill="#ffffff" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="140" cy="125" r="28" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <path d="M92 207 Q140 157 188 207" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <text x="140" y="226" class="label">Profesyonel</text>
  <text x="140" y="256" class="label">operatör</text>

  <rect x="295" y="70" width="300" height="185" rx="26" fill="#ffffff" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <text x="322" y="104" class="group">FRONTEND</text>
  <rect x="330" y="125" width="230" height="95" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="445" y="165" class="label">React + TypeScript</text>
  <text x="445" y="198" class="small">Web arayüzü</text>

  <rect x="655" y="45" width="500" height="350" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <text x="683" y="83" class="group">BACKEND</text>
  <rect x="700" y="105" width="410" height="80" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="905" y="143" class="label">FastAPI + Pydantic</text>
  <text x="905" y="171" class="small">HTTP ve API sözleşmesi</text>
  <rect x="700" y="215" width="240" height="125" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="820" y="253" class="label">Plan ve</text>
  <text x="820" y="283" class="label">authorization</text>
  <text x="820" y="316" class="small">iş kuralları</text>
  <path d="M1010 230 h75 v90 h-75 z" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <ellipse cx="1047.5" cy="230" rx="37.5" ry="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <ellipse cx="1047.5" cy="320" rx="37.5" ry="12" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="1047" y="278" class="label">SQLite</text>

  <rect x="655" y="470" width="500" height="340" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <text x="683" y="508" class="group">EXECUTION CONTROLLER</text>
  <rect x="700" y="535" width="190" height="105" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="795" y="580" class="label">Worker</text>
  <text x="795" y="612" class="small">lease / heartbeat</text>
  <rect x="930" y="535" width="180" height="105" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="1020" y="580" class="label">ansible-runner</text>
  <text x="1020" y="612" class="small">child process</text>
  <rect x="700" y="680" width="410" height="82" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="905" y="716" class="label">Frozen workspace + artifact</text>
  <text x="905" y="745" class="small">manifest, event ve sonuç belgesi</text>

  <rect x="1240" y="500" width="310" height="260" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <text x="1270" y="538" class="group">YÖNETİLEN HOSTLAR</text>
  <g fill="#ccfbf1" stroke="#0f766e" stroke-width="3">
    <rect x="1285" y="575" width="95" height="58" rx="12"/>
    <rect x="1410" y="575" width="95" height="58" rx="12"/>
    <rect x="1285" y="665" width="95" height="58" rx="12"/>
    <rect x="1410" y="665" width="95" height="58" rx="12"/>
  </g>
  <text x="1332" y="611" class="small">web01</text>
  <text x="1457" y="611" class="small">web02</text>
  <text x="1332" y="701" class="small">db01</text>
  <text x="1457" y="701" class="small">...</text>

  <path d="M245 160 H295" class="line"/>
  <text x="270" y="145" class="small">kullanır</text>
  <path d="M595 160 H655" class="line"/>
  <text x="625" y="145" class="small">HTTP</text>
  <path d="M905 185 V215" class="line"/>
  <path d="M940 277 H1008" class="line"/>
  <path d="M1048 340 V455 H795 V535" class="line"/>
  <text x="930" y="444" class="small">pending Job</text>
  <path d="M890 586 H930" class="line"/>
  <path d="M1020 640 V680" class="line"/>
  <path d="M1110 586 H1225" class="line"/>
  <text x="1170" y="568" class="small">SSH</text>
</svg>
