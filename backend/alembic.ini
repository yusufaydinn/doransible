[alembic]
script_location = alembic
prepend_sys_path = .
# `prepend_sys_path` ayrıştırması için işletim sistemi ayracını kullan.
path_separator = os
file_template = %%(rev)s_%%(slug)s
# `timezone` ayarlanmadı: yalnızca revision başlığındaki tarih yorumunu
# etkiler ve Windows'ta ek bir `tzdata` bağımlılığı gerektirir.

# sqlalchemy.url burada tanımlanmaz. DSN, alembic/env.py içinde
# app.core.config.Settings üzerinden okunur; böylece uygulama ve migration
# aynı yapılandırmayı kullanır ve DSN repository'ye yazılmaz.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
